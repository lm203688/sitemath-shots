appId: com.lixing.hvacfieldcalc
---
- launchApp
- waitForAnimationToEnd
- takeScreenshot: 01_tools
- tapOn: "Airflow from duct size.*"
- waitForAnimationToEnd
- takeScreenshot: 02_duct_airflow
- launchApp
- waitForAnimationToEnd
- tapOn: "Airflow from ΔT.*"
- waitForAnimationToEnd
- takeScreenshot: 03_airflow_dt
- launchApp
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Superheat.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Superheat.*"
- waitForAnimationToEnd
- takeScreenshot: 04_superheat
- launchApp
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Ampacity & breaker.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Ampacity & breaker.*"
- waitForAnimationToEnd
- takeScreenshot: 05_ampacity
- launchApp
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Charge adder.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Charge adder.*"
- waitForAnimationToEnd
- takeScreenshot: 06_charge_adder
- tapOn: "Add to job sheet"
- tapOn: "‹ Back"
- waitForAnimationToEnd
- tapOn: "Job sheet.*"
- waitForAnimationToEnd
- takeScreenshot: 07_job_sheet
