appId: com.lixing.sitemath
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Rectangular slab'
    timeout: 40000
- takeScreenshot: 01_tools
- tapOn: 'Rectangular slab'
- extendedWaitUntil:
    visible: 'Result'
    timeout: 25000
- takeScreenshot: 02_slab_us
- tapOn: 'Metric'
- extendedWaitUntil:
    visible: 'm³'
    timeout: 20000
- takeScreenshot: 03_slab_metric
- tapOn: 'US'
- tapOn: '‹ Back'
- extendedWaitUntil:
    visible: 'Masonry'
    timeout: 20000
- scrollUntilVisible:
    element: 'Tile'
    direction: DOWN
    timeout: 30000
- tapOn: 'Tile'
- extendedWaitUntil:
    visible: 'Add to job takeoff'
    timeout: 25000
- takeScreenshot: 04_tile
- tapOn: 'Add to job takeoff'
- extendedWaitUntil:
    visible: 'Job takeoff'
    timeout: 25000
- tapOn: 'each'
- inputText: '24.99'
- hideKeyboard
- extendedWaitUntil:
    visible: 'Total'
    timeout: 20000
- takeScreenshot: 05_job_total
- tapOn: '‹ Back'
- extendedWaitUntil:
    visible: 'Tools'
    timeout: 20000
- scrollUntilVisible:
    element: 'Feet · inch · fraction'
    direction: DOWN
    timeout: 30000
- tapOn: 'Feet · inch · fraction'
- extendedWaitUntil:
    visible: 'Result'
    timeout: 25000
- takeScreenshot: 06_length_math
