appId: com.lixing.hvacfieldcalc
---
- launchApp
- waitForAnimationToEnd
- takeScreenshot: 01_tools
- tapOn: "Airflow from duct size.*"
- takeScreenshot: 02_duct_airflow
- launchApp
- waitForAnimationToEnd
- tapOn: "Airflow from ΔT.*"
- takeScreenshot: 03_airflow_dt
- launchApp
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Ampacity & breaker.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Ampacity & breaker.*"
- takeScreenshot: 04_ampacity
- launchApp
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Charge adder.*"
    direction: DOWN
    timeout: 30000
- tapOn: "Charge adder.*"
- takeScreenshot: 05_charge_adder
- tapOn: "Add to job sheet"
- tapOn: "‹ Back"
- tapOn: "Job sheet"
- takeScreenshot: 06_job_sheet
