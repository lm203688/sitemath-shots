appId: com.lixing.sitemath
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "^Rectangular slab.*"
    timeout: 60000
- takeScreenshot: 01_tools
- tapOn: "^Rectangular slab.*"
- extendedWaitUntil:
    visible: "^Result$"
    timeout: 30000
- takeScreenshot: 02_slab_us
- tapOn: ".*Metric.*"
- takeScreenshot: 03_metric_probe
