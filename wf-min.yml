name: sitemath-shots
on: workflow_dispatch
jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: shoot
        run: bash scripts/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitemath-shots
          path: shots
